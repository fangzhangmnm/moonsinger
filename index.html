<!doctype html>
<!-- created 2026-10-06 by Claude Opus 5.5 —— MoonSinger 编辑器第一版试验页（整屏固定、页面不滚动；只有谱面板自己滚） -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>MoonSinger</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // bundle 加载前的兜底：任何脚本错误糊一张红条（iPad 无 devtools）。抄 CatsUp。
      (function () {
        function show(text) {
          var bar = document.getElementById("errBanner");
          if (!bar) {
            bar = document.createElement("div");
            bar.id = "errBanner"; bar.className = "err-banner";
            bar.addEventListener("click", function () { bar.hidden = true; });
            (document.body || document.documentElement).appendChild(bar);
          }
          bar.hidden = false;
          bar.textContent = text + "  (点击关闭)";
        }
        window.addEventListener("error", function (e) { show("脚本错误：" + (e.message || e.error || e)); });
        window.addEventListener("unhandledrejection", function (e) { show("未处理的 Promise 错误：" + (e.reason && (e.reason.message || e.reason))); });
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header id="bar" class="bar"></header>
      <main id="stage">
        <div id="score" class="score" tabindex="0" aria-label="乐谱"></div>
        <aside id="padPanel" class="pad-panel"></aside>
      </main>
      <footer id="lyricBar" class="lyric-bar"></footer>
    </div>
    <script type="module" src="./dist/moonsinger.mjs"></script>
  </body>
</html>
